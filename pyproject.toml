[build-system]
# setuptools >= 77 understands the SPDX licence expression below (PEP 639)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h4lat"
# Bump for every release, together with CHANGELOG.md, CITATION.cff and the README (see CONTRIBUTING.md,
# "Making a release"); the release tag must be "v" + this version
version = "0.2.0"
description = "Clebsch-Gordan coefficients and lattice operators for the hypercubic group H(4)"
readme = "README.md"
# The module headers grant "version 3 of the License, or (at your option) any later version"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Emilio Taggi", email = "emilio.taggi@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "lattice QCD",
    "hypercubic group",
    "H(4)",
    "Clebsch-Gordan coefficients",
    "group theory",
    "lattice operators",
    "parton distribution functions",
    "moments of PDFs",
]
# PyPI trove classifiers (https://pypi.org/classifiers/); the licence is given by `license` above
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy",
    "sympy",
    "tqdm",
]

# Links shown in the sidebar of the PyPI page. (A [table] header takes every key below it, so the plain
# [project] keys must all come before this line.)
[project.urls]
Homepage = "https://github.com/Tag-E/h4lat"
Source = "https://github.com/Tag-E/h4lat"
Issues = "https://github.com/Tag-E/h4lat/issues"
Changelog = "https://github.com/Tag-E/h4lat/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Full feature set (operator construction, PDF output, plots, HDF5 I/O)
full = [
    "numba",
    "pylatex",
    "ipython",
    "matplotlib",
    "gvar",
    "h5py",
    "pandas",
    "tabulate",   # needed by pandas .to_markdown()
]
# Parallel computation of new CG coefficients: cg_calc(..., parallel=True)
parallel = [
    "numba",
]
# Minimal extra for Jupyter notebook pretty-printing
notebook = [
    "ipython",
]
# HDF5 persistence
hdf5 = [
    "h5py",
    "gvar",
]
# Operator analysis
operators = [
    "pandas",
    "tabulate",
    "gvar",
    "h5py",
    "ipython",
]
# Testing
dev = [
    "pytest",
    "h4lat[full]",
]

[project.scripts]
h4lat-catalogue = "h4lat.cli:catalogue_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"h4lat" = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Black — code formatter
# ---------------------------------------------------------------------------
[tool.black]
line-length = 119
# Keep existing single-quoted strings as-is
skip-string-normalization = true

# ---------------------------------------------------------------------------
# Ruff — linter + import sorter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports/vars, …)
    "I",   # isort — import ordering
    "B",   # flake8-bugbear — common bug patterns
]
ignore = [
    # Comment-style rules: the codebase uses ## banner headers and section
    # dividers intentionally — do not flag or rewrite them.
    "E265",  # block comment should start with '# '
    "E266",  # too many leading '#' for block comment
    # Line-length is enforced by Black; avoid double-reporting.
    "E501",
    # Ambiguous variable names — too strict for scientific/math code where
    # single-letter names like `l`, `O` are standard notation.
    "E741",
    # Bugbear opinionated extras that are too noisy for scientific code.
    "B905",  # zip() without strict=
    "B006",  # mutable default argument — fine in many scientific contexts
]

[tool.ruff.lint.isort]
# Keep stdlib / third-party / local sections separated by a blank line.
force-sort-within-sections = false
known-first-party = ["h4lat"]
