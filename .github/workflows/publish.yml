# GitHub Actions workflow: publish a release to PyPI.
# It runs when a release is published on GitHub (Releases -> Draft a new release -> Publish). It builds the
# package, uploads it to https://pypi.org/project/h4lat/ and attaches the built files to the GitHub release.
#
# The upload uses PyPI "Trusted Publishing": PyPI trusts this workflow of this repository (configured once on
# pypi.org, see CONTRIBUTING.md), so no password or API token is stored on GitHub.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Build the source distribution (.tar.gz) and the wheel (.whl) into dist/
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # A version on PyPI can never be uploaded twice, so stop before building if the tag and the version
      # in pyproject.toml disagree (e.g. tag v0.3.0 while pyproject.toml still says 0.2.0)
      - name: Check that the release tag is "v" + the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The release tag $TAG does not match the version $VERSION in pyproject.toml (expected v$VERSION)"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      # Check that PyPI will accept the metadata and render the README
      - run: python -m twine check --strict dist/*
      # Hand dist/ over to the two jobs below (each job runs on a fresh machine)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Upload dist/ to PyPI
  pypi:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment named in the trusted-publisher settings on pypi.org
    environment:
      name: pypi
      url: https://pypi.org/project/h4lat/
    permissions:
      id-token: write # lets the job prove to PyPI that it is this workflow (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Attach the wheel and the source distribution to the GitHub release
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to add files to the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload dist/ to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
